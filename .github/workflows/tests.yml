name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m operator_app --db data/ci.sqlite3 demo --scenario supplier_outage --approve
      - run: python -m operator_app --db data/uncertain.sqlite3 demo --scenario timeout_after_commit --approve
      - run: python -m operator_app --db data/transfer.sqlite3 demo --goal 'Restock 3 mice within $1' --scenario normal
